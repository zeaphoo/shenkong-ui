<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shenkong-ui | Modern Sci-Fi React UI Components</title>
    <link rel="icon" href="/logo.svg?i=1" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('shenkong-theme');
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
